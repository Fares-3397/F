<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Tracking System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .screen {
            width: 800px;
            height: 450px;
            background: #020202;
            border: 1px solid #0f3a0f;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.08);
        }

        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 0, 0.08);
            top: 0;
            animation: scan 4s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            height: 360px;
            border: 1px solid rgba(0, 255, 0, 0.1);
            border-radius: 50%;
            z-index: 1;
        }

        .circle2 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 1px dashed rgba(0, 255, 0, 0.06);
            border-radius: 50%;
            z-index: 1;
        }

        .header {
            position: absolute;
            top: 8px;
            left: 12px;
            color: #00cc00;
            font-size: 12px;
            letter-spacing: 2px;
            z-index: 5;
            text-shadow: 0 0 4px #00cc00;
        }

        .time {
            position: absolute;
            top: 8px;
            right: 12px;
            color: #00aa00;
            font-size: 11px;
            z-index: 5;
        }

        .status {
            position: absolute;
            top: 30px;
            right: 12px;
            color: #ff4444;
            font-size: 11px;
            z-index: 5;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .target {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #00aaff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00aaff, 0 0 40px rgba(0, 170, 255, 0.3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
        }

        .target-label {
            position: absolute;
            top: 54%;
            left: 50%;
            transform: translateX(-50%);
            color: #00aaff;
            font-size: 10px;
            z-index: 5;
            text-align: center;
        }

        .attacker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 18px #ff0000;
            top: 50%;
            left: 50%;
            z-index: 6;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .attacker-label {
            position: absolute;
            color: #ff0000;
            font-size: 10px;
            z-index: 6;
            white-space: nowrap;
        }

        .line {
            position: absolute;
            height: 1px;
            background: #ff3333;
            transform-origin: left center;
            z-index: 2;
            box-shadow: 0 0 8px #ff0000;
            transition: all 0.4s;
        }

        .log {
            position: absolute;
            bottom: 8px;
            left: 12px;
            color: #00cc00;
            font-size: 10px;
            line-height: 1.5;
            z-index: 5;
            text-shadow: 0 0 2px #00cc00;
        }

        .coords {
            position: absolute;
            bottom: 8px;
            right: 12px;
            color: #00aa00;
            font-size: 10px;
            z-index: 5;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="screen">
        <div class="grid"></div>
        <div class="scanline"></div>
        <div class="circle"></div>
        <div class="circle2"></div>

        <div class="header">◉ SECURE TRACKING SYSTEM v2.7</div>
        <div class="time" id="time">00:00:00</div>
        <div class="status" id="status">⚠ THREAT ACTIVE</div>

        <div class="target"></div>
        <div class="target-label">TARGET: LOCKED</div>

        <div class="attacker" id="attacker"></div>
        <div class="attacker-label" id="attackerLabel">ATTACKER</div>

        <div class="line" id="line"></div>

        <div class="log" id="log">
            [*] Initializing...<br>
            [*] Connecting to secure node...<br>
            [*] Target locked.
        </div>

        <div class="coords" id="coords">
            LAT: --.--<br>
            LON: --.--
        </div>
    </div>

    <script>
        const attacker = document.getElementById('attacker');
        const attackerLabel = document.getElementById('attackerLabel');
        const line = document.getElementById('line');
        const log = document.getElementById('log');
        const timeEl = document.getElementById('time');
        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        const centerX = 400;
        const centerY = 225;
        const radius = 120;

        let angle = Math.random() * 360;

        const statusMessages = [
            "⚠ THREAT ACTIVE",
            "⚠ SIGNAL UNSTABLE",
            "⚠ REROUTING...",
            "⚠ TRACKING RESTORED",
            "⚠ HIGH RISK",
            "⚠ MOVEMENT DETECTED"
        ];

        const logMessages = [
            "[*] Scanning node...",
            "[*] IP shifted: 197.x.x.x",
            "[*] Firewall detected",
            "[*] Analyzing traffic...",
            "[*] Attacker moving",
            "[*] New route found",
            "[*] Signal encrypted",
            "[*] Monitoring target...",
            "[*] Threat level updated",
            "[*] Tracking active...",
            "[*] Coordinates changed",
            "[*] Rerouting connection..."
        ];

        const cities = [
            { name: "Cairo", lat: 30.0444, lon: 31.2357 },
            { name: "Alexandria", lat: 31.2001, lon: 29.9187 },
            { name: "Giza", lat: 29.9870, lon: 31.2118 },
            { name: "Benghazi", lat: 32.1167, lon: 20.0833 },
            { name: "Tripoli", lat: 32.8872, lon: 13.1913 },
            { name: "Khartoum", lat: 15.5007, lon: 32.5599 },
            { name: "Unknown", lat: 0, lon: 0 }
        ];

        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            timeEl.textContent = `${h}:${m}:${s}`;
        }

        function updatePositions() {
            const rad = angle * (Math.PI / 180);
            const x = centerX + Math.cos(rad) * radius;
            const y = centerY + Math.sin(rad) * radius;

            attacker.style.left = x + 'px';
            attacker.style.top = y + 'px';

            attackerLabel.style.left = (x + 10) + 'px';
            attackerLabel.style.top = (y - 15) + 'px';

            const dx = centerX - x;
            const dy = centerY - y;
            const length = Math.sqrt(dx * dx + dy * dy);
            const lineAngle = Math.atan2(dy, dx) * (180 / Math.PI);

            line.style.width = length + 'px';
            line.style.left = x + 'px';
            line.style.top = y + 'px';
            line.style.transform = `rotate(${lineAngle}deg)`;
        }

        function moveAttacker() {
            angle += (Math.random() - 0.5) * 60;
            angle = Math.max(0, Math.min(360, angle));
            updatePositions();
        }

        function addLog(message) {
            const lines = log.innerHTML.split('<br>');
            if (lines.length > 6) {
                lines.shift();
            }
            lines.push(message);
            log.innerHTML = lines.join('<br>');
        }

        function updateCoords() {
            const city = cities[Math.floor(Math.random() * cities.length)];
            if (city.lat === 0) {
                coordsEl.innerHTML = `LAT: --.--<br>LON: --.--`;
            } else {
                const lat = city.lat + (Math.random() - 0.5) * 2;
                const lon = city.lon + (Math.random() - 0.5) * 2;
                coordsEl.innerHTML = `LAT: ${lat.toFixed(4)}<br>LON: ${lon.toFixed(4)}`;
            }
        }

        let logIndex = 0;
        let statusIndex = 0;

        setInterval(updateTime, 1000);
        setInterval(moveAttacker, 1000);
        setInterval(updateCoords, 3500);

        setInterval(() => {
            addLog(logMessages[logIndex % logMessages.length]);
            logIndex++;
        }, 2200);

        setInterval(() => {
            statusEl.textContent = statusMessages[statusIndex % statusMessages.length];
            statusIndex++;
        }, 4500);

        updateTime();
        updatePositions();
        updateCoords();
    </script>
</body>
</html>
