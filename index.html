<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Tracking System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .screen {
            width: 800px;
            height: 450px;
            background: #020202;
            border: 1px solid #0f3a0f;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.08);
        }

        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 0, 0.1);
            top: 0;
            animation: scan 4s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .header {
            position: absolute;
            top: 8px;
            left: 12px;
            color: #00cc00;
            font-size: 12px;
            letter-spacing: 2px;
            z-index: 5;
            text-shadow: 0 0 4px #00cc00;
        }

        .time {
            position: absolute;
            top: 8px;
            right: 12px;
            color: #00aa00;
            font-size: 11px;
            z-index: 5;
        }

        .status {
            position: absolute;
            top: 30px;
            right: 12px;
            color: #ff4444;
            font-size: 11px;
            z-index: 5;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .target {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #00aaff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00aaff;
            top: 60%;
            left: 30%;
            z-index: 3;
        }

        .target-label {
            position: absolute;
            top: 62%;
            left: 31%;
            color: #00aaff;
            font-size: 10px;
            z-index: 3;
        }

        .attacker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 18px #ff0000;
            top: 25%;
            left: 65%;
            z-index: 4;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .attacker-label {
            position: absolute;
            top: 23%;
            left: 63%;
            color: #ff0000;
            font-size: 10px;
            z-index: 4;
        }

        .line {
            position: absolute;
            height: 1px;
            background: #ff3333;
            transform-origin: left center;
            z-index: 2;
            box-shadow: 0 0 8px #ff0000;
            transition: all 0.4s;
        }

        .log {
            position: absolute;
            bottom: 8px;
            left: 12px;
            color: #00cc00;
            font-size: 10px;
            line-height: 1.5;
            z-index: 5;
            text-shadow: 0 0 2px #00cc00;
        }

        .coords {
            position: absolute;
            bottom: 8px;
            right: 12px;
            color: #00aa00;
            font-size: 10px;
            z-index: 5;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="screen">
        <div class="grid"></div>
        <div class="scanline"></div>

        <div class="header">◉ SECURE TRACKING SYSTEM v2.7</div>
        <div class="time" id="time">00:00:00</div>
        <div class="status" id="status">⚠ THREAT ACTIVE</div>

        <div class="target"></div>
        <div class="target-label">TARGET: UNKNOWN</div>

        <div class="attacker" id="attacker"></div>
        <div class="attacker-label">ATTACKER: UNTRACED</div>

        <div class="line" id="line"></div>

        <div class="log" id="log">
            [*] Initializing...<br>
            [*] Connecting to secure node...<br>
            [*] Target locked.
        </div>

        <div class="coords" id="coords">
            LAT: 30.0444<br>
            LON: 31.2357
        </div>
    </div>

    <script>
        const attacker = document.getElementById('attacker');
        const line = document.getElementById('line');
        const log = document.getElementById('log');
        const timeEl = document.getElementById('time');
        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        const targetX = 260;
        const targetY = 280;

        let attackerX = 520;
        let attackerY = 110;

        const statusMessages = [
            "⚠ THREAT ACTIVE",
            "⚠ SIGNAL UNSTABLE",
            "⚠ REROUTING...",
            "⚠ TRACKING RESTORED",
            "⚠ HIGH RISK"
        ];

        const logMessages = [
            "[*] Scanning node...",
            "[*] IP shifted: 197.x.x.x",
            "[*] Firewall detected",
            "[*] Analyzing traffic...",
            "[*] Attacker moving",
            "[*] New route found",
            "[*] Signal encrypted",
            "[*] Monitoring target...",
            "[*] Threat level updated",
            "[*] Tracking active..."
        ];

        const cities = [
            { name: "Cairo", lat: 30.0444, lon: 31.2357 },
            { name: "Alexandria", lat: 31.2001, lon: 29.9187 },
            { name: "Giza", lat: 29.9870, lon: 31.2118 },
            { name: "Benghazi", lat: 32.1167, lon: 20.0833 },
            { name: "Tripoli", lat: 32.8872, lon: 13.1913 },
            { name: "Unknown", lat: 0, lon: 0 }
        ];

        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            timeEl.textContent = `${h}:${m}:${s}`;
        }

        function updateLine() {
            const dx = targetX - attackerX;
            const dy = targetY - attackerY;
            const length = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);

            line.style.width = length + 'px';
            line.style.left = attackerX + 'px';
            line.style.top = attackerY + 'px';
            line.style.transform = `rotate(${angle}deg)`;
        }

        function moveAttacker() {
            attackerX += (Math.random() - 0.5) * 40;
            attackerY += (Math.random() - 0.5) * 40;

            attackerX = Math.max(60, Math.min(730, attackerX));
            attackerY = Math.max(40, Math.min(390, attackerY));

            attacker.style.left = attackerX + 'px';
            attacker.style.top = attackerY + 'px';

            updateLine();
        }

        function addLog(message) {
            const lines = log.innerHTML.split('<br>');
            if (lines.length > 6) {
                lines.shift();
            }
            lines.push(message);
            log.innerHTML = lines.join('<br>');
        }

        function updateCoords() {
            const city = cities[Math.floor(Math.random() * cities.length)];
            if (city.lat === 0) {
                coordsEl.innerHTML = `LAT: --.--<br>LON: --.--`;
            } else {
                const lat = city.lat + (Math.random() - 0.5) * 2;
                const lon = city.lon + (Math.random() - 0.5) * 2;
                coordsEl.innerHTML = `LAT: ${lat.toFixed(4)}<br>LON: ${lon.toFixed(4)}`;
            }
        }

        let logIndex = 0;
        let statusIndex = 0;

        setInterval(updateTime, 1000);
        setInterval(moveAttacker, 1200);
        setInterval(updateCoords, 3000);

        setInterval(() => {
            addLog(logMessages[logIndex % logMessages.length]);
            logIndex++;
        }, 2500);

        setInterval(() => {
            statusEl.textContent = statusMessages[statusIndex % statusMessages.length];
            statusIndex++;
        }, 5000);

        updateTime();
        updateLine();
        updateCoords();
    </script>
</body>
</html>
